name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  powershell:
    name: PowerShell Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Parse all .ps1 files
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$parseErrors
            ) | Out-Null
            foreach ($err in $parseErrors) {
              Write-Host "::error file=$($_.FullName),line=$($err.Extent.StartLineNumber)::$($err.Message)"
              $errors++
            }
          }
          if ($errors -gt 0) { throw "Found $errors parse error(s)" }
          Write-Host "All PowerShell files parsed successfully" -ForegroundColor Green

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingComputerNameHardcoded,PSAvoidOverwritingBuiltInCmdlets,PSUseSingularNouns
          if ($results) { $results | Format-Table -AutoSize }
          $errorCount = @($results | Where-Object Severity -eq 'Error').Count
          if ($errorCount -gt 0) { throw "PSScriptAnalyzer found $errorCount error(s)" }
          if ($results) { Write-Warning "$($results.Count) warning(s) found (non-blocking)" }
          else { Write-Host "Clean - no issues found" -ForegroundColor Green }

  xaml:
    name: Validate WPF XAML
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load and validate XAML
        shell: pwsh
        run: |
          Add-Type -AssemblyName PresentationFramework
          Add-Type -AssemblyName PresentationCore
          Add-Type -AssemblyName WindowsBase

          $errors = 0

          # Standalone .xaml files
          Get-ChildItem -Path . -Filter *.xaml -Recurse | ForEach-Object {
            try {
              $xaml = Get-Content $_.FullName -Raw
              [System.Windows.Markup.XamlReader]::Parse($xaml) | Out-Null
              Write-Host "OK: $($_.FullName)" -ForegroundColor Green
            } catch {
              Write-Host "::error file=$($_.FullName)::XAML load failed: $($_.Exception.Message)"
              $errors++
            }
          }

          # Embedded XAML inside PowerShell here-strings
          Get-ChildItem -Path . -Filter *.ps1 -Recurse | ForEach-Object {
            $file = $_
            $content = Get-Content $file.FullName -Raw
            $pattern = '(?s)@[''"]\s*(<(?:Window|UserControl|Page|ResourceDictionary)\b.*?</(?:Window|UserControl|Page|ResourceDictionary)>)\s*[''"]@'
            $matches = [regex]::Matches($content, $pattern)
            foreach ($m in $matches) {
              try {
                [System.Windows.Markup.XamlReader]::Parse($m.Groups[1].Value) | Out-Null
                Write-Host "OK: embedded XAML in $($file.Name)" -ForegroundColor Green
              } catch {
                Write-Host "::error file=$($file.FullName)::Embedded XAML load failed: $($_.Exception.Message)"
                $errors++
              }
            }
          }

          if ($errors -gt 0) { throw "$errors XAML validation error(s)" }
          Write-Host "All XAML validated" -ForegroundColor Green
